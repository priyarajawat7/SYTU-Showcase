<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYTU Connect — Professional Networking Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&family=Space+Grotesk:wght=400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   TOKENS (Preserved core theme variables)
═══════════════════════════════════════════════ */
:root {
  --bg-base: #0b0d17;
  --bg-surface: #12152a;
  --bg-card: rgba(255,255,255,0.04);
  --bg-card-hover: rgba(255,255,255,0.07);
  --bg-glass: rgba(18,21,42,0.75);
  --border: rgba(120,100,255,0.18);
  --border-subtle: rgba(255,255,255,0.06);
  --accent-1: #7c5fe6;
  --accent-2: #4f8ef7;
  --accent-grad: linear-gradient(135deg, #7c5fe6 0%, #4f8ef7 100%);
  --accent-grad-soft: linear-gradient(135deg, rgba(124,95,230,0.15) 0%, rgba(79,142,247,0.15) 100%);
  --online: #22d3a5;
  --away: #f59e0b;
  --offline: #6b7280;
  --text-primary: #f0f1ff;
  --text-secondary: #8b8fb3;
  --text-muted: #4b4f6b;
  --bubble-out: linear-gradient(135deg, #7c5fe6, #4f8ef7);
  --bubble-in: rgba(255,255,255,0.06);
  --sidebar-w: 290px; /* Enhanced padding footprint */
  --profile-w: 320px;
  --shadow-lg: 0 24px 64px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 30px rgba(124,95,230,0.25);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --font-ui: 'Inter', sans-serif;
  --font-display: 'Space Grotesk', sans-serif;
  --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="light"] {
  --bg-base: #f0Flux;
  --bg-base: #f02ff;
  --bg-surface: #ffffff;
  --bg-card: rgba(124,95,230,0.06);
  --bg-card-hover: rgba(124,95,230,0.1);
  --bg-glass: rgba(255,255,255,0.85);
  --border: rgba(124,95,230,0.2);
  --border-subtle: rgba(0,0,0,0.07);
  --text-primary: #12152a;
  --text-secondary: #4b4f6b;
  --text-muted: #9095b8;
  --bubble-in: rgba(124,95,230,0.08);
  --shadow-lg: 0 24px 64px rgba(0,0,0,0.12);
}

/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-ui);
  background: var(--bg-base);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  transition: background var(--transition), color var(--transition);
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
input, textarea { font-family: inherit; color: inherit; }

/* ═══════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════ */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr var(--profile-w);
  height: 100vh;
  overflow: hidden;
  position: relative;
}
.app::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 10%, rgba(124,95,230,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 80% 90%, rgba(79,142,247,0.1) 0%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}

/* ═══════════════════════════════════════════════
   LEFT SIDEBAR & PREMIUM FILTER ARCHITECTURE
═══════════════════════════════════════════════ */
.sidebar {
  background: var(--bg-glass);
  backdrop-filter: blur(24px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  z-index: 1;
}
.sidebar-header {
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--border-subtle);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.brand-icon {
  width: 36px; height: 36px;
  background: var(--accent-grad);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: var(--shadow-glow);
}
.brand-name {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  background: var(--accent-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.3px;
}
.brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; }

.sidebar-stats-summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: rgba(124,95,230,0.06);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  border: 1px solid var(--border-subtle);
  font-size: 11px;
}
.active-pulse {
  display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--online);
}
.pulse-dot {
  width: 6px; height: 6px; background: var(--online); border-radius: 50%;
  animation: ripple 1.8s infinite ease-in-out;
}
@keyframes ripple {
  0% { transform: scale(0.8); opacity: 0.5; }
  50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 8px var(--online); }
  100% { transform: scale(0.8); opacity: 0.5; }
}

.search-wrap { position: relative; margin-bottom: 4px;}
.search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 14px; pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 9px 12px 9px 36px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-primary);
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(124,95,230,0.12); }

/* Premium Real-time Filter Row Graphics */
.filter-concourse-tabs {
  display: flex;
  gap: 4px;
  padding: 10px 14px 6px;
  border-bottom: 1px solid var(--border-subtle);
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-concourse-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
  background: rgba(255,255,255,0.02);
  border: 1px solid transparent;
  white-space: nowrap;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-tab:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
}
.filter-tab.active {
  background: var(--accent-grad-soft);
  color: var(--text-primary);
  border-color: rgba(124,95,230,0.25);
  box-shadow: 0 4px 12px rgba(124,95,230,0.08);
}
.filter-tab active:scale { transform: scale(0.96); }
.filter-badge-dot {
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2);
}

.sidebar-section {
  padding: 14px 14px 6px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  text-transform: uppercase;
}
.contacts-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.contact-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--transition), transform var(--transition);
  position: relative;
}
.contact-item:hover { background: var(--bg-card-hover); }
.contact-item.active { background: var(--accent-grad-soft); }
.contact-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 60%;
  background: var(--accent-grad);
  border-radius: 2px;
}
.avatar-wrap { position: relative; flex-shrink: 0; }
.avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  transition: transform var(--transition);
}
.avatar-wrap:hover .avatar { transform: scale(1.06); }
.status-dot {
  position: absolute;
  bottom: 1px; right: 1px;
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 2px solid var(--bg-surface);
}
.status-dot.online { background: var(--online); }
.status-dot.away { background: var(--away); }
.status-dot.offline { background: var(--offline); }
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-preview { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.contact-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.contact-time { font-size: 10px; color: var(--text-muted); }
.badge {
  min-width: 18px; height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--accent-grad);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

.sidebar-widget {
  padding: 10px 12px; margin: 4px 8px; background: rgba(255,255,255,0.01);
  border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);
}
.widget-title { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px;}
.pill-container { display: flex; flex-wrap: wrap; gap: 4px; }
.mini-pill { font-size: 10px; padding: 2px 6px; background: var(--bg-card); border-radius: 4px; color: var(--text-secondary); border: 1px solid var(--border-subtle); }

.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--border-subtle);
  display: flex; align-items: center; gap: 12px;
}
.my-avatar {
  width: 36px; height: 36px; border-radius: 50%; position: relative; cursor: pointer;
}
.my-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; transition: transform var(--transition); }
.my-avatar:hover img { transform: scale(1.08); }
.my-avatar .status-dot { bottom: 0; right: 0; }
.my-name { font-size: 13px; font-weight: 600; flex: 1; }
.my-role { font-size: 10px; color: var(--text-muted); }
.footer-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 32px; height: 32px;
  border-radius: var(--radius-xs);
  background: var(--bg-card);
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all var(--transition);
}
.icon-btn:hover { background: var(--accent-grad-soft); color: var(--accent-1); }

/* ═══════════════════════════════════════════════
   CHAT CENTER
═══════════════════════════════════════════════ */
.chat-area {
  display: flex; flex-direction: column;
  height: 100vh;
  overflow: hidden;
  position: relative;
  z-index: 1;
}
.chat-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  display: flex; align-items: center; gap: 14px;
  flex-shrink: 0;
}
.chat-header-avatar { width: 44px; height: 44px; border-radius: 50%; position: relative; cursor: pointer; }
.chat-header-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid var(--accent-1); transition: transform var(--transition); }
.chat-header-avatar:hover img { transform: scale(1.05); }
.chat-header-info { flex: 1; }
.chat-header-name { font-size: 16px; font-weight: 700; font-family: var(--font-display); }
.chat-header-status online { color: var(--online); display: flex; align-items: center; gap: 5px; }
.chat-header-status.away { color: var(--away); }
.chat-header-status.offline { color: var(--offline); }
.typing-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: blink 1.2s ease infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
.chat-header-actions { display: flex; gap: 6px; }
.hdr-btn {
  width: 38px; height: 38px;
  border-radius: var(--radius-xs);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  transition: all var(--transition);
}
.hdr-btn:hover { background: var(--accent-grad-soft); border-color: var(--accent-1); color: var(--accent-1); }

.theme-toggle {
  width: 38px; height: 38px;
  border-radius: var(--radius-xs);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: all var(--transition);
  cursor: pointer;
}
.theme-toggle:hover { background: var(--accent-grad-soft); border-color: var(--accent-1); color: var(--accent-1); }

/* Messages */
.messages-wrap {
  flex: 1; overflow-y: auto;
  padding: 24px 24px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.date-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 16px 0 8px;
}
.date-divider-line { flex: 1; height: 1px; background: var(--border-subtle); }
.date-divider-label { font-size: 11px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
.msg-row {
  display: flex; gap: 10px;
  max-width: 75%;
  animation: slideUp 0.3s ease;
}
.msg-row.out { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.in { align-self: flex-start; }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.msg-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  flex-shrink: 0; margin-top: 2px; cursor: pointer;
}
.msg-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; transition: transform var(--transition); }
.msg-avatar:hover img { transform: scale(1.1); }
.msg-content { display: flex; flex-direction: column; gap: 2px; }
.msg-row.out .msg-content { align-items: flex-end; }
.msg-bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 13.5px;
  line-height: 1.55;
  max-width: 100%;
  word-break: break-word;
  position: relative;
}
.msg-row.in .msg-bubble {
  background: var(--bubble-in);
  border-bottom-left-radius: 5px;
  border: 1px solid var(--border-subtle);
}
.msg-row.out .msg-bubble {
  background: var(--bubble-out);
  border-bottom-right-radius: 5px;
  color: #fff;
}
.msg-meta { display: flex; align-items: center; gap: 5px; padding: 0 3px; }
.msg-time { font-size: 10px; color: var(--text-muted); }
.read-check { font-size: 12px; color: var(--accent-2); }
.msg-row.in .read-check { display: none; }

.system-msg {
  align-self: center;
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-card);
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--border-subtle);
  margin: 8px 0;
}
.emoji-msg .msg-bubble {
  background: transparent !important;
  border: none !important;
  font-size: 32px;
  padding: 4px 0;
}

.file-bubble {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-surface) !important;
  border: 1px solid var(--border) !important;
  padding: 12px 16px !important;
  border-radius: var(--radius-sm) !important;
  transition: box-shadow var(--transition), border-color var(--transition);
}
.file-bubble:hover {
  border-color: var(--accent-2) !important;
  box-shadow: 0 4px 12px rgba(79,142,247,0.1);
}
.file-icon {
  width: 40px; height: 40px;
  background: var(--accent-grad-soft);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-size { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
.file-dl { font-size: 16px; color: var(--accent-2); cursor: pointer; transition: transform 0.2s; }
.file-dl:hover { transform: translateY(2px); color: var(--accent-1); }

.typing-indicator {
  align-self: flex-start;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.3s ease;
}
.typing-indicator.visible { opacity: 1; transform: translateY(0); }
.typing-bubble {
  background: var(--bubble-in);
  border: 1px solid var(--border-subtle);
  border-radius: 18px;
  border-bottom-left-radius: 5px;
  padding: 10px 16px;
  display: flex; gap: 4px; align-items: center;
}

/* Input Bar */
.chat-input-wrap {
  padding: 12px 16px 14px;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  flex-shrink: 0;
}
.input-actions-top { display: flex; gap: 6px; margin-bottom: 8px; }
.input-action-btn {
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  font-size: 11px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 5px;
  transition: all var(--transition);
}
.input-action-btn:hover { background: var(--accent-grad-soft); border-color: var(--accent-1); color: var(--accent-1); }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.input-box-wrap { flex: 1; position: relative; }
.chat-input {
  width: 100%;
  padding: 12px 50px 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 24px;
  font-size: 14px;
  color: var(--text-primary);
  outline: none;
  resize: none;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.chat-input::placeholder { color: var(--text-muted); }
.chat-input:focus { border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(124,95,230,0.12); }
.emoji-trigger {
  position: absolute; right: 14px; bottom: 12px;
  font-size: 18px; cursor: pointer; opacity: 0.6; transition: opacity var(--transition);
}
.emoji-trigger:hover { opacity: 1; }
.send-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--accent-grad);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  transition: all var(--transition);
  box-shadow: 0 4px 16px rgba(124,95,230,0.4);
}
.send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(124,95,230,0.55); }
.send-btn:active { transform: scale(0.96); }

/* Emoji picker */
.emoji-picker {
  position: absolute;
  bottom: 100%; right: 0;
  background: var(--bg-glass);
  backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
  box-shadow: var(--shadow-lg);
  display: none;
  z-index: 100;
  margin-bottom: 8px;
}
.emoji-picker.open { display: grid; }
.ep-emoji { font-size: 20px; cursor: pointer; padding: 4px; border-radius: 6px; text-align: center; transition: background var(--transition); }
.ep-emoji:hover { background: var(--bg-card-hover); }

/* ═══════════════════════════════════════════════
   RIGHT PROFILE PANEL
═══════════════════════════════════════════════ */
.profile-panel {
  background: var(--bg-glass);
  backdrop-filter: blur(24px);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  position: relative;
  z-index: 1;
  transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
}
.profile-panel.highlight-active {
  background: rgba(124, 95, 230, 0.09);
  box-shadow: inset 0 0 24px rgba(124, 95, 230, 0.25);
}
.profile-hero {
  padding: 28px 20px 20px;
  text-align: center;
  background: var(--accent-grad-soft);
  border-bottom: 1px solid var(--border-subtle);
  position: relative;
}
.profile-hero-bg {
  position: absolute; inset: 0;
  background: var(--accent-grad);
  opacity: 0.08;
}
.profile-avatar-lg {
  width: 84px; height: 84px;
  border-radius: 50%;
  margin: 0 auto 12px;
  position: relative;
  border: 3px solid rgba(255,255,255,0.15);
  box-shadow: var(--shadow-glow);
  cursor: pointer;
}
.profile-avatar-lg img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; transition: transform var(--transition); }
.profile-avatar-lg:hover img { transform: scale(1.06); }

═══════════════════════════════════════════════ */
.pfp-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(11, 13, 23, 0.85);
  backdrop-filter: blur(16px);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.26s cubic-bezier(0.4, 0, 0.2, 1);
}
.pfp-lightbox.active {
  opacity: 1;
  pointer-events: auto;
}
.lightbox-content {
  position: relative;
  max-width: 90vw;
  max-height: 80vh;
  transform: scale(0.9);
  transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.pfp-lightbox.active .lightbox-content {
  transform: scale(1);
}
.lightbox-img {
  width: min(400px, 80vw);
  height: min(400px, 80vw);
  object-fit: cover;
  border-radius: var(--radius);
  border: 2px solid var(--border);
  box-shadow: var(--shadow-lg), var(--shadow-glow);
}
.lightbox-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);

}
.lightbox-close {
  position: absolute;
  top: -40px;
  right: 0;
  font-size: 22px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: color var(--transition);
}
.lightbox-close:hover { color: var(--text-primary); }

// ═══════════════════════════════════════
// LIGHTBOX ENGINE (Preserved Zoom Feature)
// ═══════════════════════════════════════
function zoomImage(imgUrl, profileTitle) {
  const lightbox = document.getElementById("pfpLightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxTitle = document.getElementById("lightboxTitle");
  
  lightboxImg.src = imgUrl;
  lightboxTitle.textContent = profileTitle;
  lightbox.classList.add("active");
}

function closeLightbox(event, forceClose = false) {
  if (forceClose || event.target.id === "pfpLightbox" || event.target.className === "lightbox-close") {
    document.getElementById("pfpLightbox").classList.remove("active");
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    document.getElementById("pfpLightbox").classList.remove("active");
  }
});

function triggerHeaderAvatarClick(event) {
  event.stopPropagation();
  zoomImage(activeContact.highResAvatar, activeContact.name);
}

// ═══════════════════════════════════════
// DYNAMIC FILTER ENGINE CONFIGURATION
// ═══════════════════════════════════════
function setFilter(mode, element) {
  currentFilterMode = mode;
  
  // Graphical Active State Toggling Logic
  document.querySelectorAll('.filter-tab').forEach(btn => btn.classList.remove('active'));
  element.classList.add('active');

  // Dynamic Section Title Update for professional feel
  const titleEl = document.getElementById("concourseSectionTitle");
  if (mode === "all") titleEl.textContent = "Contacts";
  if (mode === "online") titleEl.textContent = "Online Members";
  if (mode === "unread") titleEl.textContent = "Unread Messages";
  if (mode === "hubs") titleEl.textContent = "Active Communities";

  renderContacts(document.getElementById("searchInput").value);
}

// ═══════════════════════════════════════
// RENDER CONTACTS (Upgraded with Status Filter Logic)
// ═══════════════════════════════════════
function renderContacts(searchQuery = "") {
  const list = document.getElementById("contactsList");
  list.innerHTML = "";
  
  // Pipeline filter execution sorting matrix
  let filteredList = CONTACTS.filter(c => {
    const matchesSearch = c.name.toLowerCase().includes(searchQuery.toLowerCase()) || c.role.toLowerCase().includes(searchQuery.toLowerCase());
    if (!matchesSearch) return false;

    // Contacts status tab metrics filtering logic
    if (currentFilterMode === "online") return c.status === "online";
    if (currentFilterMode === "unread") return c.badge > 0;
    if (currentFilterMode === "hubs") return c.isHub === true;
    return true; // Mode 'all' fall-through parameter fallback
  });

  if (filteredList.length === 0) {
    list.innerHTML = `<div style="padding: 30px 16px; text-align: center; color: var(--text-muted); font-size: 12px; font-family: var(--font-display);">No contacts match this filter configuration.</div>`;
    return;
  }

  filteredList.forEach(c => {
      const div = document.createElement("div");
      div.className = "contact-item" + (c.id === activeContact.id ? " active" : "");
      div.innerHTML = `
        <div class="avatar-wrap" onclick="event.stopPropagation(); zoomImage('${c.highResAvatar}', '${c.name}')" title="Zoom Avatar">
          <img class="avatar" src="${c.avatar}" alt="${c.name}">
          <div class="status-dot ${c.status}"></div>
        </div>
        <div class="contact-info" onclick="selectContactById(${c.id})">
          <div class="contact-name">${c.name}</div>
          <div class="contact-preview">${c.preview}</div>
        </div>
        <div class="contact-meta" onclick="selectContactById(${c.id})">
          <div class="contact-time">${c.time}</div>
          ${c.badge ? `<div class="badge">${c.badge}</div>` : ""}
        </div>`;
      list.appendChild(div);
    });
}

function selectContactById(id) {
  const target = CONTACTS.find(c => c.id === id);
  if(target) selectContact(target);
}

function renderChatHeader(c) {
  const hdrAv = document.getElementById("headerAvatar");
  hdrAv.innerHTML = `<img src="${c.avatar}" alt="${c.name}" title="Zoom Avatar">`;
  document.getElementById("headerName").textContent = c.name;
  const statusEl = document.getElementById("chatHeader").querySelector(".chat-header-status");
  statusEl.className = "chat-header-status " + c.status;
  document.getElementById("headerStatusText").textContent = c.status === "online" ? "Online" : c.status === "away" ? "Away" : "Offline";
  document.getElementById("typingAvatar").querySelector("img").src = c.avatar;
}

// ═══════════════════════════════════════
// MESSAGES LAYER
// ═══════════════════════════════════════
function renderMessages(c) {
  const wrap = document.getElementById("messagesWrap");
  wrap.innerHTML = `<div class="date-divider"><div class="date-divider-line"></div><div class="date-divider-label">Today</div><div class="date-divider-line"></div></div>`;
  c.messages.forEach(m => {
    if (m.type === "file") {
      renderFileMsg(wrap, m);
    } else {
      renderTextMsg(wrap, m, c);
    }
  });
  wrap.scrollTop = wrap.scrollHeight;
}

function renderTextMsg(wrap, m, c) {
  const isOut = m.from === "me";
  const isEmoji = /^[\p{Emoji}\s]+$/u.test(m.text) && m.text.trim().length <= 6;
  const row = document.createElement("div");
  row.className = `msg-row ${isOut ? "out" : "in"} ${isEmoji ? "emoji-msg" : ""}`;
  row.innerHTML = `
    ${!isOut ? `<div class="msg-avatar" onclick="zoomImage('${c.highResAvatar}', '${c.name}')" title="Zoom Avatar"><img src="${c.avatar}" alt="${c.name}"></div>` : ""}
    <div class="msg-content">
      <div class="msg-bubble">${m.text}</div>
      <div class="msg-meta">
        <span class="msg-time">${m.time}</span>
        ${isOut ? `<span class="read-check">${m.read ? "✓✓" : "✓"}</span>` : ""}
      </div>
    </div>`;
  wrap.appendChild(row);
}

function renderFileMsg(wrap, m) {
  const isOut = m.from === "me";
  const row = document.createElement("div");
  row.className = `msg-row ${isOut ? "out" : "in"}`;
  row.innerHTML = `
    <div class="msg-content">
      <div class="msg-bubble file-bubble">
        <div class="file-icon">📄</div>
        <div class="file-info">
          <div class="file-name">${m.fileName}</div>
          <div class="file-size">${m.fileSize}</div>
        </div>
        <span class="file-dl" onclick="addSystemMsg('⬇️ Download initiated for file: ${m.fileName}')">⬇️</span>
      </div>
      <div class="msg-meta">
        <span class="msg-time">${m.time}</span>
      </div>
    </div>`;
  wrap.appendChild(row);
}

// ═══════════════════════════════════════

// ═══════════════════════════════════════
function highlightProfile(targetSectionId = "hero") {
  const panel = document.getElementById("profilePanel");
  panel.classList.add("highlight-active");
  setTimeout(() => panel.classList.remove("highlight-active"), 1200);

  let targetNode;
  if(targetSectionId === "hero") targetNode = document.getElementById("prof-hero");
  if(targetSectionId === "resources") targetNode = document.getElementById("prof-resources");
  
  if(targetNode) {
    targetNode.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// ═══════════════════════════════════════
// COMMS CORE HANDLERS
// ═══════════════════════════════════════
function sendMsg() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  const newMsg = { from: "me", text, time: getCurrentTime(), read: false };
  activeContact.messages.push(newMsg);
  activeContact.preview = text;
  input.value = "";
  input.style.height = "auto";
  renderMessages(activeContact);
  renderContacts(document.getElementById("searchInput").value);
}

function getCurrentTime() {
  const now = new Date();
  return now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0");
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}
function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

// PICKERS & INTERFACES
// ═══════════════════════════════════════
function toggleEmojiPicker() {
  const picker = document.getElementById("emojiPicker");
  picker.classList.toggle("open");
}
function renderEmojiPicker() {
  const picker = document.getElementById("emojiPicker");
  EMOJIS.forEach(e => {
    const span = document.createElement("div");
    span.className = "ep-emoji";
    span.textContent = e;
    span.onclick = () => {
      document.getElementById("chatInput").value += e;
      picker.classList.remove("open");
    };
    picker.appendChild(span);
  });
}
document.addEventListener("click", e => {
  const picker = document.getElementById("emojiPicker");
  if (!e.target.closest(".input-box-wrap")) picker.classList.remove("open");
});

function addSystemMsg(text) {
  const wrap = document.getElementById("messagesWrap");
  const div = document.createElement("div");
  div.className = "system-msg";
  div.textContent = text;
  wrap.appendChild(div);
  wrap.scrollTop = 9999;
}

function toggleTheme() {
  theme = theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", theme);
  document.querySelector(".theme-toggle").textContent = theme === "dark" ? "🌙" : "☀️";
}

document.getElementById("searchInput").addEventListener("input", e => renderContacts(e.target.value));
